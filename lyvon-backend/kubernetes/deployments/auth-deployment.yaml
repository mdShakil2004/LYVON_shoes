apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 3 # Start with 3, auto-scale to 100
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/your-repo/auth-service:latest # Or ECR
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: lyvon-secrets # From AWS Secrets Manager
